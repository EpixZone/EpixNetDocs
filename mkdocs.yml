  - Get started:
      - How EpixNet works: start/how-it-works.md
      - Install:
          - Choose your platform: start/install.md
          - Linux: start/install-linux.md
          - Windows: start/install-windows.md
          - macOS: start/install-macos.md
          - Android: start/install-android.md
          - iOS: start/install-ios.md
      - Use EpixNet:
          - Run a node: start/running.md
          - Dashboard and sidebar: start/dashboard.md
          - Browser and wallet: start/browser-wallet.md
          - Privacy and routing: start/privacy.md
