          - EVX programs: build/evx.md
          - Package mirrors: build/package-mirrors.md
  - API reference:
      - Overview: api/index.md
      - Wrapper commands: api/wrapper.md
      - Xite commands: api/xite.md
      - File commands: api/files.md
      - Database commands: api/database.md
      - Identity and crypto: api/identity.md
      - Merger and feeds: api/merger.md
