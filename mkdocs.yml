site_name: EpixNet Docs
site_description: Documentation for EpixNet, the peer-to-peer web platform. Run a node, build xites, integrate Epix Chain, and develop with AI coding agents.
site_author: EpixZone
copyright: Released under the MIT License. Maintained by the EpixNet contributors.

repo_url: https://github.com/EpixZone/EpixNet
repo_name: EpixZone/EpixNet
edit_uri: https://github.com/EpixZone/EpixNetDocs/edit/main/docs/en/

docs_dir: docs/en
site_dir: site

# The docs are also published as a xite. Explicit .html links work the same
# from a web server, a public gateway and inside the EpixNet wrapper.
use_directory_urls: false

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/brand/epix-icon.svg
  favicon: assets/brand/favicon.ico
  # Fonts are self-hosted (see assets/stylesheets/fonts.css). Never load
  # Google Fonts: the xite build must work offline and over Tor.
  font: false
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/epix.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/EpixZone
      name: EpixZone on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: en

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

