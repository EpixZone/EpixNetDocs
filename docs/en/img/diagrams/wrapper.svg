<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">How a xite page reaches the node</title><desc id="d">The xite runs in an inner frame inside the wrapper page. It sends commands to the wrapper with postMessage. The wrapper forwards them over a WebSocket to the EpixNet node on your machine, which checks permissions, reads and writes files, queries the database, signs with your keys, and exchanges signed files with peers.</desc><defs><marker id="ah-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="d-head"/></marker><marker id="ah-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="d-head"/></marker></defs><rect x="8" y="8" width="428" height="404" rx="14" class="d-box-soft"/><text x="24" y="32" class="d-label" text-anchor="start"><tspan x="24" dy="0">Browser tab</tspan></text><rect x="22" y="44" width="400" height="354" rx="10" class="d-box"/><text x="40" y="72" class="d-title" text-anchor="start"><tspan x="40" dy="0">Wrapper page</tspan></text><text x="40" y="93" class="d-muted" text-anchor="start"><tspan x="40" dy="0">Served by your node. Holds the connection to it,</tspan></text><text x="40" y="110" class="d-muted" text-anchor="start"><tspan x="40" dy="0">shows prompts, the sidebar and notifications.</tspan></text><rect x="40" y="196" width="364" height="186" rx="10" class="d-box-accent"/><text x="58" y="224" class="d-title" text-anchor="start"><tspan x="58" dy="0">Your xite (inner frame)</tspan></text><text x="58" y="246" class="d-text" text-anchor="start"><tspan x="58" dy="0">index.html, scripts, styles, EpixFrame</tspan></text><text x="58" y="274" class="d-muted" text-anchor="start"><tspan x="58" dy="0">Runs in its own origin. It cannot read the wrapper,</tspan></text><text x="58" y="291" class="d-muted" text-anchor="start"><tspan x="58" dy="0">open the node connection, or reach other xites.</tspan></text><text x="58" y="319" class="d-muted" text-anchor="start"><tspan x="58" dy="0">Storage, files, the database and identity are</tspan></text><text x="58" y="336" class="d-muted" text-anchor="start"><tspan x="58" dy="0">reached by sending commands upward.</tspan></text><line x1="222" y1="194" x2="222" y2="130" class="d-line" marker-end="url(#ah-end)" marker-start="url(#ah-start)"/><text x="236" y="158" class="d-label" text-anchor="start"><tspan x="236" dy="0">postMessage</tspan></text><text x="236" y="174" class="d-muted" text-anchor="start"><tspan x="236" dy="0">commands, replies, events</tspan></text><rect x="508" y="44" width="204" height="232" rx="10" class="d-box"/><text x="526" y="72" class="d-title" text-anchor="start"><tspan x="526" dy="0">EpixNet node</tspan></text><text x="526" y="92" class="d-muted" text-anchor="start"><tspan x="526" dy="0">on your machine</tspan></text><circle cx="532" cy="124" r="3" class="d-dot"/><text x="544" y="128" class="d-text" text-anchor="start"><tspan x="544" dy="0">Checks permissions</tspan></text><circle cx="532" cy="152" r="3" class="d-dot"/><text x="544" y="156" class="d-text" text-anchor="start"><tspan x="544" dy="0">Reads and writes files</tspan></text><circle cx="532" cy="180" r="3" class="d-dot"/><text x="544" y="184" class="d-text" text-anchor="start"><tspan x="544" dy="0">Queries the database</tspan></text><circle cx="532" cy="208" r="3" class="d-dot"/><text x="544" y="212" class="d-text" text-anchor="start"><tspan x="544" dy="0">Signs with your keys</tspan></text><circle cx="532" cy="236" r="3" class="d-dot"/><text x="544" y="240" class="d-text" text-anchor="start"><tspan x="544" dy="0">Verifies peer data</tspan></text><line x1="424" y1="80" x2="506" y2="80" class="d-line" marker-end="url(#ah-end)" marker-start="url(#ah-start)"/><text x="465" y="68" class="d-label" text-anchor="middle"><tspan x="465" dy="0">WebSocket</tspan></text><rect x="508" y="338" width="204" height="60" rx="10" class="d-box"/><text x="610" y="363" class="d-title" text-anchor="middle"><tspan x="610" dy="0">Peers</tspan></text><text x="610" y="383" class="d-muted" text-anchor="middle"><tspan x="610" dy="0">other nodes with the xite</tspan></text><line x1="610" y1="278" x2="610" y2="336" class="d-line" marker-end="url(#ah-end)" marker-start="url(#ah-start)"/><text x="622" y="312" class="d-label" text-anchor="start"><tspan x="622" dy="0">signed files</tspan></text></svg>
