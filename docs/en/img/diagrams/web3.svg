<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" role="img" aria-labelledby="t d"><title id="t">The parts of a web3 xite</title><desc id="d">Three parts: the xite files replicated by peers, the wallet in the visitor's browser which holds keys and signs transactions, and Epix Chain which holds contracts, tokens and xID names. The page connects to the wallet, the wallet sends transactions to the chain, and the page reads chain state directly over JSON-RPC.</desc><defs><marker id="ah-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="d-head"/></marker><marker id="ah-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="d-head"/></marker></defs><rect x="2" y="12" width="194" height="200" rx="10" class="d-box"/><text x="20" y="42" class="d-title" text-anchor="start"><tspan x="20" dy="0">Xite files</tspan></text><text x="20" y="61" class="d-muted" text-anchor="start"><tspan x="20" dy="0">replicated by peers</tspan></text><circle cx="25" cy="92" r="3" class="d-dot"/><text x="37" y="96" class="d-text" text-anchor="start"><tspan x="37" dy="0">HTML, CSS, JavaScript</tspan></text><circle cx="25" cy="119" r="3" class="d-dot"/><text x="37" y="123" class="d-text" text-anchor="start"><tspan x="37" dy="0">EpixFrame and EpixKit</tspan></text><circle cx="25" cy="146" r="3" class="d-dot"/><text x="37" y="150" class="d-text" text-anchor="start"><tspan x="37" dy="0">Contract ABIs</tspan></text><circle cx="25" cy="173" r="3" class="d-dot"/><text x="37" y="177" class="d-text" text-anchor="start"><tspan x="37" dy="0">Optional SQL database</tspan></text><rect x="263" y="12" width="194" height="200" rx="10" class="d-box-accent"/><text x="281" y="42" class="d-title" text-anchor="start"><tspan x="281" dy="0">Wallet</tspan></text><text x="281" y="61" class="d-muted" text-anchor="start"><tspan x="281" dy="0">in the visitor's browser</tspan></text><circle cx="286" cy="92" r="3" class="d-dot"/><text x="298" y="96" class="d-text" text-anchor="start"><tspan x="298" dy="0">Holds the keys</tspan></text><circle cx="286" cy="119" r="3" class="d-dot"/><text x="298" y="123" class="d-text" text-anchor="start"><tspan x="298" dy="0">Asks for approval</tspan></text><circle cx="286" cy="146" r="3" class="d-dot"/><text x="298" y="150" class="d-text" text-anchor="start"><tspan x="298" dy="0">Signs transactions</tspan></text><circle cx="286" cy="173" r="3" class="d-dot"/><text x="298" y="177" class="d-text" text-anchor="start"><tspan x="298" dy="0">Any EVM wallet</tspan></text><rect x="524" y="12" width="194" height="200" rx="10" class="d-box"/><text x="542" y="42" class="d-title" text-anchor="start"><tspan x="542" dy="0">Epix Chain</tspan></text><text x="542" y="61" class="d-muted" text-anchor="start"><tspan x="542" dy="0">EVM and Cosmos</tspan></text><circle cx="547" cy="92" r="3" class="d-dot"/><text x="559" y="96" class="d-text" text-anchor="start"><tspan x="559" dy="0">Smart contracts</tspan></text><circle cx="547" cy="119" r="3" class="d-dot"/><text x="559" y="123" class="d-text" text-anchor="start"><tspan x="559" dy="0">EPIX and tokens</tspan></text><circle cx="547" cy="146" r="3" class="d-dot"/><text x="559" y="150" class="d-text" text-anchor="start"><tspan x="559" dy="0">xID names and profiles</tspan></text><circle cx="547" cy="173" r="3" class="d-dot"/><text x="559" y="177" class="d-text" text-anchor="start"><tspan x="559" dy="0">Public JSON-RPC</tspan></text><line x1="198" y1="112" x2="261" y2="112" class="d-line" marker-end="url(#ah-end)"/><line x1="459" y1="112" x2="522" y2="112" class="d-line" marker-end="url(#ah-end)"/><text x="229" y="101" class="d-label" text-anchor="middle"><tspan x="229" dy="0">connect</tspan></text><text x="490" y="101" class="d-label" text-anchor="middle"><tspan x="490" dy="0">send</tspan></text><path d="M99 214 V248 H621 V216" class="d-line" marker-end="url(#ah-end)"/><text x="360" y="270" class="d-label" text-anchor="middle"><tspan x="360" dy="0">The page reads chain state over JSON-RPC. Reading needs no wallet.</tspan></text></svg>
