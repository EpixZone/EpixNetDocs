<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-labelledby="t d"><title id="t">What happens when you open a xite</title><desc id="d">Five steps: resolve the .epix name to an address through xID, find peers through trackers, the DHT and peer exchange, verify the content.json signature against the xite address, fetch each file and check it against its signed hash, then open the page from your disk and serve it to others.</desc><defs><marker id="ah-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="d-head"/></marker><marker id="ah-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="d-head"/></marker></defs><rect x="6" y="12" width="132" height="136" rx="10" class="d-box"/><circle cx="30" cy="40" r="12" class="d-num"/><text x="30" y="44.5" class="d-numtext" text-anchor="middle"><tspan x="30" dy="0">1</tspan></text><text x="18" y="80" class="d-title" text-anchor="start"><tspan x="18" dy="0">Resolve name</tspan></text><text x="18" y="104" class="d-muted" text-anchor="start"><tspan x="18" dy="0">xID maps a .epix</tspan><tspan x="18" dy="17">name to an address</tspan></text><line x1="139" y1="80.0" x2="149" y2="80.0" class="d-line" marker-end="url(#ah-end)"/><rect x="150" y="12" width="132" height="136" rx="10" class="d-box"/><circle cx="174" cy="40" r="12" class="d-num"/><text x="174" y="44.5" class="d-numtext" text-anchor="middle"><tspan x="174" dy="0">2</tspan></text><text x="162" y="80" class="d-title" text-anchor="start"><tspan x="162" dy="0">Find peers</tspan></text><text x="162" y="104" class="d-muted" text-anchor="start"><tspan x="162" dy="0">Trackers, the DHT</tspan><tspan x="162" dy="17">and peer exchange</tspan></text><line x1="283" y1="80.0" x2="293" y2="80.0" class="d-line" marker-end="url(#ah-end)"/><rect x="294" y="12" width="132" height="136" rx="10" class="d-box-accent"/><circle cx="318" cy="40" r="12" class="d-num"/><text x="318" y="44.5" class="d-numtext" text-anchor="middle"><tspan x="318" dy="0">3</tspan></text><text x="306" y="80" class="d-title" text-anchor="start"><tspan x="306" dy="0">Verify manifest</tspan></text><text x="306" y="104" class="d-muted" text-anchor="start"><tspan x="306" dy="0">Signature must</tspan><tspan x="306" dy="17">match the address</tspan></text><line x1="427" y1="80.0" x2="437" y2="80.0" class="d-line" marker-end="url(#ah-end)"/><rect x="438" y="12" width="132" height="136" rx="10" class="d-box-accent"/><circle cx="462" cy="40" r="12" class="d-num"/><text x="462" y="44.5" class="d-numtext" text-anchor="middle"><tspan x="462" dy="0">4</tspan></text><text x="450" y="80" class="d-title" text-anchor="start"><tspan x="450" dy="0">Fetch files</tspan></text><text x="450" y="104" class="d-muted" text-anchor="start"><tspan x="450" dy="0">Each file checked</tspan><tspan x="450" dy="17">against its hash</tspan></text><line x1="571" y1="80.0" x2="581" y2="80.0" class="d-line" marker-end="url(#ah-end)"/><rect x="582" y="12" width="132" height="136" rx="10" class="d-box"/><circle cx="606" cy="40" r="12" class="d-num"/><text x="606" y="44.5" class="d-numtext" text-anchor="middle"><tspan x="606" dy="0">5</tspan></text><text x="594" y="80" class="d-title" text-anchor="start"><tspan x="594" dy="0">Open and share</tspan></text><text x="594" y="104" class="d-muted" text-anchor="start"><tspan x="594" dy="0">Served from disk,</tspan><tspan x="594" dy="17">seeded to others</tspan></text></svg>
