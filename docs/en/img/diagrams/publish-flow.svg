<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 194" role="img" aria-labelledby="t d"><title id="t">From an edit to a published update</title><desc id="d">Four steps: edit files in the xite folder, sign so the node hashes the files and signs content.json with the owner key, publish so the node announces the new content.json to peers, and peers verify the signature and fetch only the changed files.</desc><defs><marker id="ah-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="d-head"/></marker><marker id="ah-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="d-head"/></marker></defs><rect x="3" y="12" width="165" height="170" rx="10" class="d-box"/><circle cx="29" cy="42" r="12" class="d-num"/><text x="29" y="46.5" class="d-numtext" text-anchor="middle"><tspan x="29" dy="0">1</tspan></text><text x="17" y="84" class="d-title" text-anchor="start"><tspan x="17" dy="0">Edit</tspan></text><text x="17" y="109" class="d-muted" text-anchor="start"><tspan x="17" dy="0">Change files in the</tspan><tspan x="17" dy="17">xite folder. A refresh</tspan><tspan x="17" dy="17">shows the result.</tspan></text><line x1="170" y1="97.0" x2="184" y2="97.0" class="d-line" marker-end="url(#ah-end)"/><rect x="186" y="12" width="165" height="170" rx="10" class="d-box-accent"/><circle cx="212" cy="42" r="12" class="d-num"/><text x="212" y="46.5" class="d-numtext" text-anchor="middle"><tspan x="212" dy="0">2</tspan></text><text x="200" y="84" class="d-title" text-anchor="start"><tspan x="200" dy="0">Sign</tspan></text><text x="200" y="109" class="d-muted" text-anchor="start"><tspan x="200" dy="0">The node hashes every</tspan><tspan x="200" dy="17">file and signs</tspan><tspan x="200" dy="17">content.json with the</tspan><tspan x="200" dy="17">owner key.</tspan></text><line x1="353" y1="97.0" x2="367" y2="97.0" class="d-line" marker-end="url(#ah-end)"/><rect x="369" y="12" width="165" height="170" rx="10" class="d-box"/><circle cx="395" cy="42" r="12" class="d-num"/><text x="395" y="46.5" class="d-numtext" text-anchor="middle"><tspan x="395" dy="0">3</tspan></text><text x="383" y="84" class="d-title" text-anchor="start"><tspan x="383" dy="0">Publish</tspan></text><text x="383" y="109" class="d-muted" text-anchor="start"><tspan x="383" dy="0">The node announces</tspan><tspan x="383" dy="17">the new content.json</tspan><tspan x="383" dy="17">to this xite's peers.</tspan></text><line x1="536" y1="97.0" x2="550" y2="97.0" class="d-line" marker-end="url(#ah-end)"/><rect x="552" y="12" width="165" height="170" rx="10" class="d-box"/><circle cx="578" cy="42" r="12" class="d-num"/><text x="578" y="46.5" class="d-numtext" text-anchor="middle"><tspan x="578" dy="0">4</tspan></text><text x="566" y="84" class="d-title" text-anchor="start"><tspan x="566" dy="0">Peers update</tspan></text><text x="566" y="109" class="d-muted" text-anchor="start"><tspan x="566" dy="0">Peers verify the</tspan><tspan x="566" dy="17">signature and fetch</tspan><tspan x="566" dy="17">the changed files.</tspan></text></svg>
